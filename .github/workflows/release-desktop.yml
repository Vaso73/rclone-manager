# Vaso73 fork test workflow – never part of the upstream PR.
# Builds Windows x64 portable EXE/ZIP without an installer, signing secrets or
# creating a GitHub Release. Output is available only as workflow artifacts.
name: 'Release Desktop'

on:
  push:
    branches: [vaso/windows-build]
  workflow_dispatch:

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate VSS helper with Windows PowerShell
        shell: powershell
        run: ./backend/core/resources/vss/Test-VssPolicy.ps1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          key: vaso-windows-x64

      - name: Install frontend dependencies
        run: npm ci

      - name: Read version
        id: get_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json

      # Updater artifacts need the authors' TAURI_SIGNING_PRIVATE_KEY, so they are disabled.
      - name: Write no-updater-artifacts config
        shell: bash
        run: echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/no-updater.json"

      - name: Build portable executable (unsigned)
        shell: bash
        run: npm run tauri build -- --features portable --target x86_64-pc-windows-msvc --no-bundle --config "$RUNNER_TEMP/no-updater.json"

      - name: Test portable path resolution on Windows
        shell: bash
        run: cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib services::portable -- --test-threads=1

      - name: Test backup profile policies on Windows
        shell: bash
        run: cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib services::backup -- --test-threads=1

      - name: Test inline local source paths on Windows
        shell: bash
        run: cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib inline_local -- --test-threads=1

      - name: Test disk reconnection policies on Windows
        shell: bash
        run: cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib mount_settings -- --test-threads=1

      - name: Test profile save and deletion policies on Windows
        shell: bash
        run: cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib services::settings::remote::manager -- --test-threads=1

      - name: Test guarded workspace management on Windows
        shell: bash
        run: |
          cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib workspace_management -- --test-threads=1
          cargo test --manifest-path backend/Cargo.toml -p rclone-manager-core --features desktop,portable --target x86_64-pc-windows-msvc --lib finished_record_tests -- --test-threads=1

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $dirName = "RCloneManager"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          New-Item -ItemType Directory -Force -Path "$dirName/config" | Out-Null
          $settingsJson = @'
          {
            "app_settings": {
              "core": {
                "completed_onboarding": true
              },
              "general": {
                "interface_mode": "simple"
              }
            }
          }
          '@
          Set-Content -Path "$dirName/config/settings.json" -Value $settingsJson
          Copy-Item "backend/target/x86_64-pc-windows-msvc/release/rclone-manager.exe" "$dirName/RCloneManager.exe"
          Get-ChildItem "resources/portable/README_*" -Exclude "*linux*", "*macos*" | ForEach-Object {
              (Get-Content $_.FullName).Replace('${VERSION}', $version) | Set-Content "$dirName/$($_.Name)"
          }
          Compress-Archive -Path $dirName -DestinationPath "out/RCloneManager-portable-windows-x86_64-$version-sk.zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: rclone-manager-windows-x64-portable
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30
